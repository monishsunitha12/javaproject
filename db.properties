# ===================================================
# Microsoft SQL Server (MSSQL) Database Configuration
# ===================================================

# Host and Port of your MSSQL Server instance
db.host=localhost
db.port=1433

# Database name
db.name=library

# SQL Server Authentication credentials
db.user=sa
db.password=YourPassword123!

# Additional connection properties:
# encrypt=false or true; trustServerCertificate=true avoids SSL certificate verification issues on local/self-signed instances
db.encrypt=false
db.trustServerCertificate=true

# Set to true if you are using Windows Authentication instead of SQL Server Authentication
db.integratedSecurity=false
